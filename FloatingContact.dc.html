<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="font-family:'Public Sans',Helvetica,Arial,sans-serif">
  <a href="https://wa.me/919958231007" target="_blank" rel="noopener" aria-label="Chat on WhatsApp" style="position:fixed;left:18px;bottom:20px;z-index:70;width:56px;height:56px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 10px 26px rgba(0,0,0,0.32);transition:transform .2s, box-shadow .2s" style-hover="transform:translateY(-2px);box-shadow:0 14px 30px rgba(37,211,102,0.45)">
    <svg width="30" height="30" viewBox="0 0 32 32" fill="#ffffff" aria-hidden="true"><path d="M16 3C8.8 3 3 8.8 3 16c0 2.3.6 4.5 1.7 6.4L3 29l6.8-1.7c1.9 1 4 1.6 6.2 1.6 7.2 0 13-5.8 13-13S23.2 3 16 3zm0 23.4c-2 0-3.9-.5-5.5-1.5l-.4-.2-4 1 1-3.9-.2-.4C5.9 19.8 5.4 18 5.4 16 5.4 10.1 10.1 5.4 16 5.4S26.6 10.1 26.6 16 21.9 26.4 16 26.4zm6-7.7c-.3-.2-2-1-2.3-1.1-.3-.1-.5-.2-.8.1-.2.3-.8 1-1 1.2-.2.2-.4.3-.7.1-1.7-.8-2.9-2-3.9-3.8-.2-.3 0-.5.2-.7.2-.2.5-.6.6-.8.1-.2.1-.4 0-.6-.1-.2-.9-1.9-1.1-2.2-.2-.4-.5-.4-.8-.4h-.6c-.3 0-.7.2-1 .5-.9.9-1.2 2-1 3.2.3 1.5 1.3 3.2 2.6 4.6 1.9 2.1 4 3.3 6.5 3.7 1.4.2 2.5 0 3.4-.9.3-.3.5-.8.5-1.2v-.6c0-.3-.2-.5-.5-.6z"></path></svg>
  </a>
  <button type="button" onClick="{{ scrollToTop }}" aria-label="Back to top" style="{{ topBtnStyle }}">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14181e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  state = { visible: false };

  componentDidMount() {
    this._onScroll = () => {
      const v = window.scrollY > 400;
      if (v !== this.state.visible) this.setState({ visible: v });
    };
    window.addEventListener("scroll", this._onScroll, { passive: true });
    this._onScroll();
  }

  componentWillUnmount() {
    window.removeEventListener("scroll", this._onScroll);
  }

  renderVals() {
    const visible = this.state.visible;
    return {
      topBtnStyle: {
        position: "fixed",
        right: "18px",
        bottom: "20px",
        zIndex: 70,
        width: "52px",
        height: "52px",
        borderRadius: "50%",
        background: "#b08d3f",
        border: "0",
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        cursor: "pointer",
        boxShadow: "0 10px 26px rgba(20,24,30,0.28)",
        opacity: visible ? 1 : 0,
        transform: visible ? "translateY(0)" : "translateY(12px)",
        pointerEvents: visible ? "auto" : "none",
        transition: "opacity .25s ease, transform .25s ease, background .2s ease"
      },
      scrollToTop: () => window.scrollTo({ top: 0, behavior: "smooth" })
    };
  }
}
</script>
</body>
</html>
